<!DOCTYPE html>
<html>
<head>
    <title>{{ food.name }}</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f4f4f4;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h1 {
            margin-top: 0;
        }

        .status {
            color: green;
            font-weight: bold;
        }

        button {
            padding: 10px 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>{{ food.name }}</h1>

    <p>{{ food.description }}</p>

    <button onclick="window.location.href='/'">
        Back to Home
    </button>
</div>

</body>
</html>
