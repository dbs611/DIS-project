<!DOCTYPE html>
<html>
<head>
    <title>{{ food.name }}</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f4f4f4;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h1 {
            margin-top: 0;
        }

        .status {
            color: green;
            font-weight: bold;
        }

        button {
            padding: 10px 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>{{ food.name }}</h1>

    <p>{{ food.description }}</p>

</div>
    <form method="POST" action="/foodclub">
        <input type="menu" name="menu" placeholder="Menu">
        <input type="datetime-local" id="start_at" name="start_at">
        <input type="datetime-local" id="close_at" name="close_at">
        <p>Vegetarian</p>
        <input type="checkbox" name="vege">
        <p>Vegan</p>
        <input type="checkbox" name="vegan">
        <br>
        <button type="submit">submit</button>
    </form>

</body>
</html>
