<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Food Club</title>
    <style>
        /* Simple styling to turn your divs into visual cards */
        .card-container {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            padding: 20px;
        }
        .meal-card {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 16px;
            width: 250px;
            box-shadow: 2px 2px 8px rgba(0,0,0,0.1);
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>

    <h1>Upcoming Food Club Events</h1>
                <button onclick="window.location.href='/foodclub/add'">
                    Add a new foodclub
        </button>
    <div class="card-container">
        {% for meal in meals %}
            <div class="meal-card">
                <h3>Menu: {{ meal['menu'] }}</h3>
                <p><strong>Date:</strong> {{ meal['date'] }}</p>
                <p><strong>Chef ID:</strong> {{ meal['beboer_id'] }}</p>
            </div>
        {% else %}
            <p>No meals have been scheduled yet!</p>
        {% endfor %}
    </div>

</body>
</html>
